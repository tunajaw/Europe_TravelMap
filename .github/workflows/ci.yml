name: Verify

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Preprocessing tests
        run: npm run test:preprocess
      - name: Domain tests
        run: npm run test:domain
      - name: UI and map behavior tests
        run: npm run test:ui
      - name: Validate public dataset
        run: npm run data:validate
      - name: Production build
        run: npm run build
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: MVP end-to-end smoke tests
        run: npm run test:e2e
      - name: Upload end-to-end failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
